    <text class="c" x="54" y="386" clip-path="url(#c4)">uptime</text>
    <text class="o hide" x="36" y="408">1 year on github  ·  37 repos  ·  1,700+ commits  ·  0 tickets filed<set attributeName="opacity" to="1" begin="7.2s"/></text>
