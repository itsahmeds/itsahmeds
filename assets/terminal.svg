    <text class="c" x="54" y="430" clip-path="url(#c5)">echo $MOTTO</text>
    <text class="o hide" x="36" y="452">automate the boring bits. spec the rest. ship anyway.<set attributeName="opacity" to="1" begin="9.1s"/></text>
  </g>

