    <text class="o hide" x="36" y="342">rank-tracker/  cro-dashboards/  review-scraper/  serp-research/  content-pipeline/<set attributeName="opacity" to="1" begin="5.4s"/></text>
    <text class="o hide" x="36" y="364">publishing-cms/  crm/  pricing-research/  ai-editor/  <tspan class="d">... +30 more, most of them private</tspan><set attributeName="opacity" to="1" begin="5.4s"/></text>
  </g>

