  <text class="d" x="36" y="184">// marketer who got tired of waiting for engineering</text>

  <g>
    <text class="p hide" x="36" y="232">$<set attributeName="opacity" to="1" begin="0.6s"/></text>
    <text class="c" x="54" y="232" clip-path="url(#c1)">whoami</text>
    <text class="o hide" x="36" y="254">ahmed. software engineer by degree, marketer by trade, automation addict by choice.<set attributeName="opacity" to="1" begin="1.4s"/></text>
  </g>

  <g>
    <text class="p hide" x="36" y="276">$<set attributeName="opacity" to="1" begin="2.3s"/></text>
    <text class="c" x="54" y="276" clip-path="url(#c2)">cat ~/.stack</text>
    <text class="o hide" x="36" y="298"><tspan class="k">n8n</tspan>  <tspan class="k">make.com</tspan>  <tspan class="k">claude-code</tspan>  next.js  typescript  python  supabase  firecrawl<set attributeName="opacity" to="1" begin="3.4s"/></text>
  </g>

  <g>
