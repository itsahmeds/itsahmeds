      .out { fill: #B8D9C0; }
      .key { fill: #5CF27A; }
      .dim { fill: #4E7A5A; }
      .num { fill: #E9F5EC; font-weight: 700; }
      .tt  { fill: #4E7A5A; font-size: 12px; }
      .h { opacity: 0; }
    </style>
    <filter id="glow" x="-4%" y="-20%" width="108%" height="140%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c1"><rect x="56" y="186" width="0" height="20"><animate attributeName="width" from="0" to="56"  dur="0.36s" begin="0.5s" fill="freeze"/></rect></clipPath>
