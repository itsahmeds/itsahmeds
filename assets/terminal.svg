<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="Terminal session. whoami: ahmed, software engineer by degree, marketer by trade. Stack: automation with n8n and make.com; agents with claude code and spec-driven builds; web with next.js, typescript, tailwind, prisma, supabase; data with python, fastapi, postgres. Work: publishing-cms, content-pipeline, editorial-review, rank-tracker, review-scraper, serp-research, cro-dashboards, pricing-research, crm, website-cms and 30 more, mostly private. 1,725 commits. Scheduled automations: lead routing to CRM every 15 minutes, rank and content sheet refresh every 6 hours, weekday publishing digest to Slack.">
  <defs>
    <style>
      text { font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; }
