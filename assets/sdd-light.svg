<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Spec-driven development chain. Once: problem, research, requirements, platform, blueprint, UX, architecture, structure, roadmap. Then a loop per feature: feature, tasks, build, verify, ship, and back to feature.">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .chip { fill: #F6F8FA; stroke: #D0D7DE; stroke-width: 1.2; }
      .ct   { fill: #1F2328; font-size: 12px; font-weight: 600; }
      .lane { fill: #656D76; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; }
      .arr  { stroke: #AFB8C1; stroke-width: 1.5; fill: none; }
      .gate { fill: #656D76; font-size: 11px; font-style: italic; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AFB8C1"/></marker>
  </defs>
  <rect x="1" y="1" width="898" height="188" rx="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>

  <text class="mono lane" x="30" y="46">ONCE</text>
  <g class="sans">
    <rect class="chip" x="86"  y="30" width="66" height="26" rx="13"/><text class="ct" x="119" y="47" text-anchor="middle">problem</text>
    <rect class="chip" x="164" y="30" width="72" height="26" rx="13"/><text class="ct" x="200" y="47" text-anchor="middle">research</text>
    <rect class="chip" x="248" y="30" width="98" height="26" rx="13"/><text class="ct" x="297" y="47" text-anchor="middle">requirements</text>
    <rect class="chip" x="358" y="30" width="70" height="26" rx="13"/><text class="ct" x="393" y="47" text-anchor="middle">platform</text>
    <rect class="chip" x="440" y="30" width="76" height="26" rx="13"/><text class="ct" x="478" y="47" text-anchor="middle">blueprint</text>
    <rect class="chip" x="528" y="30" width="44" height="26" rx="13"/><text class="ct" x="550" y="47" text-anchor="middle">UX</text>
    <rect class="chip" x="584" y="30" width="96" height="26" rx="13"/><text class="ct" x="632" y="47" text-anchor="middle">architecture</text>
    <rect class="chip" x="692" y="30" width="72" height="26" rx="13"/><text class="ct" x="728" y="47" text-anchor="middle">structure</text>
    <rect class="chip" x="776" y="30" width="76" height="26" rx="13"/><text class="ct" x="814" y="47" text-anchor="middle">roadmap</text>
  </g>
  <g class="arr">
    <line x1="152" y1="43" x2="164" y2="43"/><line x1="236" y1="43" x2="248" y2="43"/><line x1="346" y1="43" x2="358" y2="43"/>
    <line x1="428" y1="43" x2="440" y2="43"/><line x1="516" y1="43" x2="528" y2="43"/><line x1="572" y1="43" x2="584" y2="43"/>
    <line x1="680" y1="43" x2="692" y2="43"/><line x1="764" y1="43" x2="776" y2="43"/>
  </g>

  <path class="arr" d="M 814 56 C 814 86, 119 60, 119 92" marker-end="url(#ah)"/>

  <text class="mono lane" x="30" y="128">LOOP</text>
  <g class="sans">
    <rect class="chip" x="86"  y="112" width="66" height="26" rx="13"/><text class="ct" x="119" y="129" text-anchor="middle">feature</text>
    <rect class="chip" x="180" y="112" width="56" height="26" rx="13"/><text class="ct" x="208" y="129" text-anchor="middle">tasks</text>
    <rect class="chip" x="264" y="112" width="56" height="26" rx="13"/><text class="ct" x="292" y="129" text-anchor="middle">build</text>
    <rect class="chip" x="348" y="112" width="60" height="26" rx="13"/><text class="ct" x="378" y="129" text-anchor="middle">verify</text>
    <rect class="chip" x="436" y="112" width="52" height="26" rx="13" fill="#22C55E" fill-opacity="0.15" stroke="#22C55E"/><text class="ct" x="462" y="129" text-anchor="middle" fill="#22C55E">ship</text>
  </g>
  <g class="arr">
    <line x1="152" y1="125" x2="178" y2="125" marker-end="url(#ah)"/>
    <line x1="236" y1="125" x2="262" y2="125" marker-end="url(#ah)"/>
    <line x1="320" y1="125" x2="346" y2="125" marker-end="url(#ah)"/>
    <line x1="408" y1="125" x2="434" y2="125" marker-end="url(#ah)"/>
  </g>
  <path class="arr" d="M 462 138 C 462 168, 119 168, 119 140" marker-end="url(#ah)"/>

  <text class="sans gate" x="540" y="129">every arrow is a gate. nothing moves until the doc before it is approved.</text>
  <text class="sans gate" x="540" y="147">enforced with hooks, not willpower.</text>
</svg>
