<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1244" viewBox="0 0 720 1244" role="img" aria-label="ahmed hameed. software engineering by degree, marketer by trade. i build things and i solve problems. 1,830 commits in the last twelve months across 40 repositories, 36 private, longest streak 19 days, peak week 227. Shipped: content-operations, topical authority, cannibalisation, refresh; headless-cms, content modelling, preview, deploy pipeline; vendor-review, review queues, automated qa; ai-editorial-review, weighted rubric, findings anchored to text; cro-dashboards, ga4 and on-site conversion in one view; rank-tracker, 1,000 keywords a run across 6 markets; publishing-control, 24k pages, 6 content types, two-way sync; review-crawlers, 3 sources, batched inside serverless caps; multi-tenant-crm, email and whatsapp outreach, lead scoring; ai-search-visibility, whether an llm mentions you, and where. range: next.js · react · vite, react native · expo, electron · chrome mv3, laravel · express · fastapi, postgres · prisma · drizzle, convex · supabase · redis. reliability: idempotent, safe to re-run, retry with backoff, per-source rate budgets, circuit breakers, 65 migrations, no downtime, vitest and playwright gates. ai layer: claude code · mcp, llm routing, model bakeoffs, semantic dedup at scale, prompt and eval harnesses, agent skill chains i wrote, n8n · make.com. spec-driven development, twenty skills: foundation runs once, delivery repeats, some any time. in every repo: typed end to end, secret scanning, commit hooks, dependency bots, error tracking, performance budgets, a runbook per job."><rect width="720" height="1244" rx="6" fill="#0C0E12"/><clipPath id="r"><rect width="720" height="1244" rx="6"/></clipPath><g clip-path="url(#r)"><text x="28" y="41" xml:space="preserve" font-family="'JetBrains Mono','Cascadia Code','SF Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#C6CBD3"><tspan fill="#5B6370">~ $ </tspan><tspan fill="#6