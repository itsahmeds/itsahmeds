<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1244" viewBox="0 0 720 1244" role="img" aria-label="ahmed hameed. software engineering by degree, marketer by trade. i build things and i solve problems. 1,828 commits in the last twelve months across 40 repositories, 36 private, longest streak 19 days, peak week 227. Shipped: content-operations, topical authority, cannibalisation, refresh, 485 commits; headless-cms, content modelling, preview, deploy pipeline, 258 commits; vendor-review, review queues, automated qa, 114 commits; ai-editorial-review, weighted rubric, findings anchored to text, 112 commits; cro-dashboards, ga4 and on-site conversion in one view, 73 commits; rank-tracker, 1,000 keywords a run across 6 markets, 66 commits; publishing-control, 24k pages, 6 content types, two-way sync, 63 commits; review-crawlers, 3 sources, batched inside serverless caps, 45 commits; multi-tenant-crm, email and whatsapp outreach, lead scoring, 29 commits; ai-search-visibility, whether an llm mentions you, and where, 18 commits. range: next.js · react · vite, react native · expo, electron · chrome mv3, laravel · express · fastapi, postgres · prisma · drizzle, convex · supabase · redis. reliability: idempotent, safe to re-run, retry with backoff, per-source rate budgets, circuit breakers, 65 migrations, no downtime, vitest and playwright gates. ai layer: claude code · mcp, llm routing, model bakeoffs, semantic dedup at scale, prompt and eval harnesses, agent skill chains i wrote, n8n · make.com. spec-driven development, twenty skills: foundation runs once, delivery repeats, some any time. in every repo: typed end to end, secret scanning, commit hooks, dependency bots, error tracking, performance budgets, a runbook per job."><rect width="720" height="1244" rx="6" fill="#0C0E12"/><clipPath id="r"><rect width="720" height="1244" rx="6"/></clipPath><g clip-path="url(#r)"><text x="28" y="41" xml:space="preserve" font-family="'JetBrains Mono','Cascadia Code','SF Mono',