<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Ahmed. Software engineer by degree, marketer by trade. A workflow: a problem comes in, n8n and Make automate it, Claude Code builds the rest, it ships.">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { fill: #1F2328; font-size: 40px; font-weight: 800; letter-spacing: -1px; }
      .sub   { fill: #656D76; font-size: 16px; }
      .lbl   { fill: #1F2328; font-size: 14px; font-weight: 700; }
      .desc  { fill: #656D76; font-size: 11.5px; }
      .tag   { fill: #656D76; font-size: 12px; }
      .wire  { fill: none; stroke: #AFB8C1; stroke-width: 2; }
      .node  { fill: #F6F8FA; stroke: #D0D7DE; stroke-width: 1.5; }
    </style>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#EAEEF2"/>
    </pattern>
    <path id="w1" d="M 218 238 C 262 238, 262 238, 306 238"/>
    <path id="w2" d="M 462 238 C 506 238, 506 238, 550 238"/>
    <path id="w3" d="M 706 238 C 730 238, 730 238, 754 238"/>
  </defs>

  <rect x="1" y="1" width="898" height="358" rx="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="358" rx="14" fill="url(#grid)"/>

  <text class="sans title" x="40" y="72">Ahmed</text>
  <text class="sans sub" x="40" y="104">Software engineer by degree. Marketer by trade.</text>
  <text class="sans sub" x="40" y="128">I build the tools instead of waiting for them.</text>

  <text class="mono tag" x="40" y="186">how most things around here get made</text>

  <path class="wire" d="M 218 238 C 262 238, 262 238, 306 238"/>
  <path class="wire" d="M 462 238 C 506 238, 506 238, 550 238"/>
  <path class="wire" d="M 706 238 C 730 238, 730 238, 754 238"/>

  <circle r="4" fill="#F97316"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#w1"/></animateMotion></circle>
  <circle r="4" fill="#8B5CF6"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0.53s"><mpath xlink:href="#w2"/></animateMotion></circle>
  <circle r="4" fill="#22C55E"><animateMotion dur="1.6s" repeatCount="indefinite" begin="1.06s"><mpath xlink:href="#w3"/></animateMotion></circle>

  <rect class="node" x="40" y="206" width="178" height="64" rx="10"/>
  <rect x="40" y="206" width="5" height="64" rx="2" fill="#F97316"/>
  <circle cx="68" cy="238" r="12" fill="#F97316" fill-opacity="0.15"/>
  <path d="M 70 230 L 63 240 L 68 240 L 66 246 L 73 236 L 68 236 Z" fill="#F97316"/>
  <text class="sans lbl"  x="90" y="234">A problem</text>
  <text class="sans desc" x="90" y="252">nobody has hours for</text>

  <rect class="node" x="306" y="206" width="156" height="64" rx="10"/>
  <rect x="306" y="206" width="5" height="64" rx="2" fill="#EA4B71"/>
  <circle cx="334" cy="238" r="12" fill="#EA4B71" fill-opacity="0.15"/>
  <circle cx="329" cy="238" r="3" fill="#EA4B71"/><circle cx="339" cy="233" r="3" fill="#EA4B71"/><circle cx="339" cy="243" r="3" fill="#EA4B71"/>
  <line x1="331" y1="237" x2="337" y2="234" stroke="#EA4B71" stroke-width="1.5"/><line x1="331" y1="239" x2="337" y2="242" stroke="#EA4B71" stroke-width="1.5"/>
  <text class="sans lbl"  x="356" y="234">n8n &#183; Make</text>
  <text class="sans desc" x="356" y="252">automate the boring bits</text>

  <rect class="node" x="550" y="206" width="156" height="64" rx="10"/>
  <rect x="550" y="206" width="5" height="64" rx="2" fill="#8B5CF6"/>
  <circle cx="578" cy="238" r="12" fill="#8B5CF6" fill-opacity="0.15"/>
  <text class="mono" x="578" y="243" text-anchor="middle" fill="#8B5CF6" font-size="13" font-weight="700">&gt;_</text>
  <text class="sans lbl"  x="600" y="234">Claude Code</text>
  <text class="sans desc" x="600" y="252">spec it, then build it</text>

  <rect class="node" x="754" y="206" width="106" height="64" rx="10"/>
  <rect x="754" y="206" width="5" height="64" rx="2" fill="#22C55E"/>
  <circle cx="782" cy="238" r="12" fill="#22C55E" fill-opacity="0.15"/>
  <path d="M 775 238 L 780 243 L 789 233" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="sans lbl"  x="802" y="234">Live</text>
  <text class="sans desc" x="802" y="252">in prod</text>

  <text class="mono tag" x="40" y="322">github.com/itsahmeds</text>
  <text class="mono tag" x="860" y="322" text-anchor="end">automation &#183; growth &#183; ai builds</text>
</svg>
