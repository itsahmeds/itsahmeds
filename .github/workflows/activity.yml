name: refresh profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/activity.yml"]

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='{ user(login:"itsahmeds"){ contributionsCollection { contributionCalendar {
            totalContributions weeks { contributionDays { date contributionCount weekday } } } } } }' > scripts/raw.json
      - name: render svg
        run: |
          python3 scripts/activity.py scripts/raw.json
          python3 scripts/render.py
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/console.svg scripts/activity.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "refresh profile"
          git pull --rebase origin main
          git push
